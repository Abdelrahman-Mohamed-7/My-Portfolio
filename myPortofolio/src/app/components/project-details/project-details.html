<div class="project-details" *ngIf="project; else notFound">

  <!-- ============ HERO / COVER ============ -->
  <section class="hero">
    <div class="hero__overlay"></div>
    <img class="hero__cover" [src]="project?.cover" [alt]="project?.name" />

    <div class="hero__content">
      <h1 class="hero__title">{{ project?.name }}</h1>
      <p class="hero__subtitle">Project #{{ project?.id }}</p>

      <a class="hero__github" [href]="project?.GitHub" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.4-1.27.73-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
        </svg>
        View on GitHub
      </a>
    </div>
  </section>

  <!-- ============ DESCRIPTION ============ -->
  <section class="section section--description">
    <h2 class="section__title">About this project</h2>
    <p class="section__text">{{ project?.description }}</p>
  </section>

  <!-- ============ GALLERY ============ -->
  <section class="section section--gallery">
    <h2 class="section__title">Screenshots</h2>

    <div class="gallery">
      <figure
        class="gallery__item"
        *ngFor="let img of project.images; let i = index"
        [style.animation-delay.ms]="i * 80"
      >
        <img [src]="img" [alt]="project?.name + ' screenshot ' + (i + 1)" loading="lazy" />
      </figure>
    </div>
  </section>

</div>

<!-- ============ NOT FOUND ============ -->
<ng-template #notFound>
  <div class="not-found">
    <h2>Project not found 😕</h2>
    <p>The project you are looking for doesn't exist.</p>
  </div>
</ng-template>
