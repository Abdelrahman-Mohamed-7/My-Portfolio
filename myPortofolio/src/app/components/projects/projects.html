<section class="projects-section">
  <h2 class="projects-title">My Projects</h2>

  <div class="projects-grid">
    @for (project of projects; track project.id; let i = $index) {
    <div class="project-card" [style.animation-delay]="(i * 0.15) + 's'">

      <!-- صورة الغلاف -->
      <div class="image-wrapper">
        <img [src]="project.cover" [alt]="project.name" class="project-img" />
        <!-- طبقة تظليل تظهر عند الوقوف -->
        <div class="image-overlay"></div>
      </div>

      <!-- بيانات المشروع -->
      <div class="project-info">
        <h3 class="project-name">{{ project.name }}</h3>

        <div class="buttons-group">
          <!-- زرار التفاصيل -->
          <button class="btn-action btn-details" (click)="navigateToDetails(project.id)">
            Details
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>

          <!-- زرار GitHub -->
          <a [href]="project.GitHub" target="_blank" rel="noopener noreferrer" class="btn-action btn-github">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.4-1.27.73-1.56-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
            GitHub
          </a>
        </div>
      </div>

    </div>
    }
  </div>
</section>
